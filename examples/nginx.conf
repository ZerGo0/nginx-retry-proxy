upstream application_with_hold {
    zone application_with_hold 64k;
    server 127.0.0.1:52011 max_fails=0;
    server 127.0.0.1:52012 backup max_fails=0;
}

upstream application_direct {
    zone application_direct 64k;
    server 127.0.0.1:52011;
}

server {
    listen 443 ssl;
    server_name api.example.com;

    # Send WebSockets straight to the app.
    location /socket/ {
        proxy_pass http://application_direct;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://application_with_hold;
        proxy_request_buffering on;
        proxy_connect_timeout 1s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 2s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
